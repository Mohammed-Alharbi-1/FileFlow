name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q fileflow tools tests
      - run: python tools/publication.py
      - run: python -m pytest -q --tb=short -k "not test_real_windows_process_exit_relaunch_and_singleton"
      - run: python tools/verify_lifecycle.py lifecycle-ci.json --headless
      - run: python -c "from importlib.metadata import version; print(version('PyInstaller')); print(version('PySide6-Essentials'))"
