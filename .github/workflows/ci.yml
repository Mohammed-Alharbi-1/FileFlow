name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q fileflow tools tests
      - run: python tools/publication.py
      - run: python -m pytest -q --tb=short -k "not test_real_windows_process_exit_relaunch_and_singleton"
      - run: python tools/verify_lifecycle.py lifecycle-ci.json --headless
      - run: python -c "from importlib.metadata import version; print(version('PyInstaller')); print(version('PySide6-Essentials'))"
