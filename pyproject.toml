[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow-desktop"
version = "1.2.2"
description = "A small, local, safety-first Windows file organizer"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials==6.11.3", "watchdog==6.0.0"]

[project.scripts]
fileflow = "fileflow.app:main"

[tool.setuptools.packages.find]
include = ["fileflow*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
